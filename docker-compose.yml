version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: support_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: SecurePostgresPassword2026!
      POSTGRES_DB: remote_support
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d remote_support"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Coturn STUN & TURN Relay Server
  coturn:
    image: coturn/coturn:latest
    container_name: support_coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    network_mode: "host" # Recommended for WebRTC TURN relaying to prevent Docker NAT issues

  # 3. FastAPI Signaling & Core Support API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://support_user:SecurePostgresPassword2026!@postgres:5432/remote_support
      SECRET_KEY: prod-super-secret-key-change-in-production-min-32-chars-long!
      STUN_SERVER: stun:stun.l.google.com:19302
      TURN_SERVER: support.yourcompany.com:3478
      TURN_SECRET: coturn-secure-hmac-auth-secret-key
    ports:
      - "8000:8000"

  # 4. Nginx Reverse Proxy with TLS
  nginx:
    image: nginx:alpine
    container_name: support_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data:

