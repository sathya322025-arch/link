# =============================================================================
# COTURN TURN & STUN SERVER PRODUCTION CONFIGURATION
# =============================================================================

# Standard Listening Ports
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# Dynamic port range for UDP/TCP relay media streams
min-port=49152
max-port=65535

# Fingerprint attribute in TURN messages (mandatory for WebRTC)
fingerprint

# Use long-term credential mechanism (RFC 5766 REST API shared secret)
use-auth-secret
static-auth-secret=coturn-secure-hmac-auth-secret-key
realm=support.yourcompany.com

# Enable verbose logging for connection debugging
verbose

# Security: Prevent loopback attacks and local network relaying
no-loopback-peers
no-multicast-peers

# Do not allow unauthenticated users
no-cli
no-tls-tickets

